# Builds an debug APK of the Avanegar fork on every push to an avanegar/** branch,
# so a test build exists without the release signing secrets. Download it from the run's Artifacts.
name: Build debug APK (avanegar fork)

on:
  push:
    branches:
      - 'avanegar/**'
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PciBuildNumber=${{ github.run_id }} --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: callvault-avanegar-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
