# Builds an debug APK of the Avanegar fork on every push to an avanegar/** branch,
# so a test build exists without the release signing secrets. Download it from the run's Artifacts.
name: Build debug APK (avanegar fork)

on:
  push:
    branches:
      - 'avanegar/**'
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PciBuildNumber=${{ github.run_id }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: callvault-avanegar-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # After the upload, so a lint finding never withholds a test APK. Findings are re-emitted as
      # annotations, which can be read back without downloading the log.
      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Report lint findings
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/reports/lint-results*.xml') + glob.glob('app/build/intermediates/lint_intermediate_text_report/**/*.xml', recursive=True):
              for i in ET.parse(f).getroot().iter('issue'):
                  if i.get('severity') not in ('Error', 'Fatal'):
                      continue
                  loc = i.find('location')
                  path = loc.get('file', '').split('/CallVault/')[-1] if loc is not None else ''
                  line = loc.get('line', '1') if loc is not None else '1'
                  msg = (i.get('id') + ': ' + i.get('message', '')).replace('\n', ' ')
                  print(f"::error file={path},line={line}::{msg}")
          PY
